<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Reel Generator</title>
    <style>
        :root {
            --primary: #3b82f6;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: var(--primary);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }

        .panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }

        h2 {
            font-size: 1.2rem;
            margin-top: 0;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #334155;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        .question-card {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            position: relative;
        }

        .question-card h3 {
            margin-top: 0;
            font-size: 1.1rem;
            color: #0f172a;
        }

        .remove-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ef4444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #2563eb;
        }

        .btn-add {
            background: #10b981;
            width: 100%;
            margin-bottom: 20px;
        }

        .btn-add:hover { background: #059669; }

        .choices-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .output-panel {
            grid-column: 1 / -1;
        }

        textarea {
            width: 100%;
            height: 200px;
            font-family: monospace;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            margin-top: 10px;
            background: #f8fafc;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>ICT Question Reel Generator</h1>

    <div class="container">
        <!-- Global Settings Panel -->
        <div class="panel">
            <h2>Global Settings</h2>
            
            <div class="form-group">
                <label>Background Image Path</label>
                <input type="text" id="g-bg" value="bgimg/Background.jpg">
            </div>
            <div class="form-group">
                <label>Background Blur (e.g., 4px)</label>
                <input type="text" id="g-blur" value="4px">
            </div>
            <div class="form-group">
                <label>Background Opacity (0.0 to 1.0)</label>
                <input type="number" step="0.1" id="g-opacity" value="1">
            </div>
            <div class="form-group">
                <label>Background Brightness (0.0 to 1.0)</label>
                <input type="number" step="0.1" id="g-bright" value="0.1">
            </div>
            <div class="form-group">
                <label>Question Type Speed (ms)</label>
                <input type="number" id="g-qspeed" value="50">
            </div>
            <div class="form-group">
                <label>Choices Type Speed (ms)</label>
                <input type="number" id="g-cspeed" value="30">
            </div>
            <div class="form-group">
                <label>Timer Delay (ms)</label>
                <input type="number" id="g-delay" value="2500">
            </div>
            <div class="form-group">
                <label>Default Question Font (rem)</label>
                <input type="text" id="g-qfont" value="1.25rem">
            </div>
            <div class="form-group">
                <label>Default Choice Font (rem)</label>
                <input type="text" id="g-cfont" value="1.1rem">
            </div>
        </div>

        <!-- Questions Panel -->
        <div class="panel">
            <h2>Questions</h2>
            <button class="btn btn-add" onclick="addQuestion()">+ Add New Question</button>
            <div id="questions-container">
                <!-- Questions will be injected here -->
            </div>
        </div>

        <!-- Output Panel -->
        <div class="panel output-panel">
            <h2>Generated Output</h2>
            <div class="action-buttons">
                <button class="btn" onclick="generateCode()">1. Generate HTML Code</button>
                <button class="btn" onclick="copyCode()" style="background: #64748b;">2. Copy to Clipboard</button>
                <button class="btn" onclick="downloadCode()" style="background: #10b981;">3. Download .html File</button>
            </div>
            <textarea id="output-code" readonly placeholder="Click 'Generate HTML Code' to create your customized reel..."></textarea>
        </div>
    </div>

    <script>
        let questionCount = 0;

        function addQuestion() {
            questionCount++;
            const div = document.createElement('div');
            div.className = 'question-card';
            div.id = `q-${questionCount}`;
            
            div.innerHTML = `
                <h3>Question #${questionCount}</h3>
                <button class="remove-btn" onclick="this.parentElement.remove()">Remove</button>
                
                <div class="form-group">
                    <label>Topic / Year Badge</label>
                    <input type="text" class="q-topic" value="Model Paper - O/L ICT">
                </div>
                
                <div class="form-group">
                    <label>Question Text (HTML allowed, e.g., &lt;br&gt; for new line)</label>
                    <input type="text" class="q-text" placeholder="Enter question here...">
                </div>

                <div class="form-group">
                    <label>Image Path (Optional, leave blank if none)</label>
                    <input type="text" class="q-img" placeholder="img/diagram.png">
                </div>

                <div class="choices-grid">
                    <div class="form-group">
                        <label>Choice 1</label>
                        <input type="text" class="c-1" placeholder="(1) ...">
                    </div>
                    <div class="form-group">
                        <label>Choice 2</label>
                        <input type="text" class="c-2" placeholder="(2) ...">
                    </div>
                    <div class="form-group">
                        <label>Choice 3</label>
                        <input type="text" class="c-3" placeholder="(3) ...">
                    </div>
                    <div class="form-group">
                        <label>Choice 4</label>
                        <input type="text" class="c-4" placeholder="(4) ...">
                    </div>
                </div>

                <div class="choices-grid">
                    <div class="form-group">
                        <label>Correct Answer</label>
                        <select class="q-correct">
                            <option value="0">Choice 1</option>
                            <option value="1">Choice 2</option>
                            <option value="2">Choice 3</option>
                            <option value="3">Choice 4</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Custom Q-Font Size (Optional)</label>
                        <input type="text" class="q-fsize" placeholder="e.g. 1rem (Leave blank for default)">
                    </div>
                    <div class="form-group">
                        <label>Custom Choice-Font Size (Optional)</label>
                        <input type="text" class="c-fsize" placeholder="e.g. 0.9rem (Leave blank for default)">
                    </div>
                </div>
            `;
            
            document.getElementById('questions-container').appendChild(div);
        }

        // Add 1 default question on load
        addQuestion();

        function generateCode() {
            // 1. Gather Global Configs
            const bgImg = document.getElementById('g-bg').value;
            const bgBlur = document.getElementById('g-blur').value;
            const bgOpacity = document.getElementById('g-opacity').value;
            const bgBright = document.getElementById('g-bright').value;
            const qSpeed = document.getElementById('g-qspeed').value;
            const cSpeed = document.getElementById('g-cspeed').value;
            const tDelay = document.getElementById('g-delay').value;
            const qFont = document.getElementById('g-qfont').value;
            const cFont = document.getElementById('g-cfont').value;

            // 2. Gather Questions
            const cards = document.querySelectorAll('.question-card');
            let qArray = [];
            
            cards.forEach(card => {
                const topic = card.querySelector('.q-topic').value.replace(/"/g, '\\"');
                const text = card.querySelector('.q-text').value.replace(/"/g, '\\"');
                const img = card.querySelector('.q-img').value;
                const c1 = card.querySelector('.c-1').value.replace(/"/g, '\\"');
                const c2 = card.querySelector('.c-2').value.replace(/"/g, '\\"');
                const c3 = card.querySelector('.c-3').value.replace(/"/g, '\\"');
                const c4 = card.querySelector('.c-4').value.replace(/"/g, '\\"');
                const correct = card.querySelector('.q-correct').value;
                const qFsize = card.querySelector('.q-fsize').value;
                const cFsize = card.querySelector('.c-fsize').value;

                let qObj = `            {
                topic: "${topic}", 
                question: "${text}",\n`;
                if(img) qObj += `                image: "${img}",\n`;
                if(qFsize) qObj += `                questionFontSize: "${qFsize}",\n`;
                if(cFsize) qObj += `                choiceFontSize: "${cFsize}",\n`;
                
                qObj += `                choices: [
                    "${c1}",
                    "${c2}",
                    "${c3}",
                    "${c4}"
                ],
                correctAnswerIndex: ${correct}
            }`;
                qArray.push(qObj);
            });

            const quizDataStr = `[\n${qArray.join(',\n')}\n        ]`;

            // 3. Build Template String (Based exactly on user's source 6)
            const template = `<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Question Reel</title>
    <style>
        /* ========================================================= */
        /* CSS CONFIGURATION: BACKGROUND IMAGE SETTINGS              */
        /* ========================================================= */
        :root {
            --bg-image: url('${bgImg}');
            --bg-blur: ${bgBlur};
            --bg-opacity: ${bgOpacity};
            --bg-brightness: ${bgBright};
        }
        /* ========================================================= */

        html {
            background-color: #0f172a; 
        }

        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: -5%; 
            left: -5%;
            width: 110%;
            height: 110%;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            filter: blur(var(--bg-blur)) brightness(var(--bg-brightness));
            opacity: var(--bg-opacity);
            z-index: -1; 
        }

        .reel-container {
            width: 100%;
            max-width: 420px; 
            height: 100vh;
            padding: 30px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .content-wrapper {
            width: 100%;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease;
        }
        .slide-out-left { transform: translateX(-100%); opacity: 0; position: absolute; }
        .slide-out-right { transform: translateX(100%); opacity: 0; position: absolute; }
        .slide-in { transform: translateX(0); opacity: 1; position: relative; }

        .top-badge {
            background-color: #eab308;
            color: #172554;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            display: inline-block;
            margin: 0 auto 15px auto;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: opacity 0.3s ease;
        }

        .question {
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 20px;
            min-height: 120px; 
        }

        .question-image {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            margin-bottom: 20px;
            object-fit: contain;
            display: none; 
            border: 2px solid #334155;
            background: #1e293b;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .choice {
            background: rgba(30, 41, 59, 0.85); 
            border: 2px solid #334155;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            min-height: 24px;
            transition: all 0.4s ease;
            backdrop-filter: blur(4px); 
        }

        .choice.correct {
            background: #16a34a;
            border-color: #4ade80;
            color: white;
            font-weight: bold;
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(22, 163, 74, 0.4);
        }

        .timer-wrapper {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.1); 
            z-index: 1000;
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .countdown {
            font-size: 5rem;
            font-weight: bold;
            text-align: center;
            color: #fbbf24;
            text-shadow: 0 4px 25px rgba(0, 0, 0, 0.8);
            transition: transform 0.2s ease;
            margin: 0;
        }

        .typing-cursor::after {
            content: '|';
            animation: blink 0.7s step-end infinite;
            color: #38bdf8;
            margin-left: 2px;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        #start-instruction {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div class="reel-container">
        <div id="content-wrapper" class="content-wrapper slide-in">
            <div style="text-align: center;">
                <div id="topic-badge" class="top-badge">Press Right Arrow (➡) to Start</div>
            </div>
            <div id="question" class="question"></div>
            <img id="question-image" class="question-image" alt="Question Diagram">
            <div id="choices" class="choices"></div>
        </div>
        <div id="timer-wrapper" class="timer-wrapper">
            <div id="timer" class="countdown">5</div>
        </div>
        <div id="start-instruction">Use Left/Right Arrow Keys to Navigate</div>
    </div>

    <script>
        // =========================================================
        // JAVASCRIPT CONFIGURATION SECTION
        // =========================================================
        const QUESTION_TYPING_SPEED = ${qSpeed}; 
        const CHOICES_TYPING_SPEED = ${cSpeed};  
        const COUNTDOWN_START_DELAY = ${tDelay}; 
        const DEFAULT_QUESTION_FONT_SIZE = "${qFont}";
        const DEFAULT_CHOICES_FONT_SIZE = "${cFont}";
        // =========================================================

        const quizData = ${quizDataStr};

        let audioCtx;
        let currentQIndex = -1;
        let currentSequenceId = 0; 

        function initAudio() {
            if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
        }

        function playTypeSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime); 
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.03);
            gainNode.gain.setValueAtTime(0.02, audioCtx.currentTime); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.03);
        }

        function playTimesUpSound() {
            if (!audioCtx) return;
            const playTone = (freq, startTime, duration) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(startTime); osc.stop(startTime + duration);
            };
            const now = audioCtx.currentTime;
            playTone(523.25, now, 0.4);       
            playTone(659.25, now + 0.15, 0.6); 
        }

        async function typeWriter(text, element, speed, sequenceId) {
            element.classList.add('typing-cursor');
            let isHTML = false; let currentText = "";
            for (let i = 0; i < text.length; i++) {
                if (currentSequenceId !== sequenceId) return false; 
                if (text.charAt(i) === '<') isHTML = true;
                currentText += text.charAt(i);
                if (text.charAt(i) === '>') isHTML = false;
                element.innerHTML = currentText;
                if (!isHTML && text.charAt(i) !== ' ') {
                    playTypeSound(); await new Promise(r => setTimeout(r, speed));
                }
            }
            element.classList.remove('typing-cursor');
            return true;
        }

        async function loadQuestion(index, direction) {
            currentSequenceId++;
            const mySequenceId = currentSequenceId;
            const currentData = quizData[index];

            const wrapper = document.getElementById('content-wrapper');
            const topicBadge = document.getElementById('topic-badge');
            const questionEl = document.getElementById('question');
            const imgEl = document.getElementById('question-image');
            const choicesContainer = document.getElementById('choices');
            const timerWrapper = document.getElementById('timer-wrapper');
            const timerEl = document.getElementById('timer');
            const instrEl = document.getElementById('start-instruction');
            
            if (instrEl) instrEl.style.display = 'none';
            if (direction === 'next') wrapper.className = 'content-wrapper slide-out-left';
            else if (direction === 'prev') wrapper.className = 'content-wrapper slide-out-right';
            
            await new Promise(r => setTimeout(r, 200));
            if (currentSequenceId !== mySequenceId) return;

            questionEl.style.fontSize = currentData.questionFontSize || DEFAULT_QUESTION_FONT_SIZE;
            topicBadge.innerText = currentData.topic;
            questionEl.innerHTML = ''; choicesContainer.innerHTML = '';
            timerWrapper.style.display = 'none';
            timerEl.style.fontSize = "5rem"; timerEl.style.color = "#fbbf24";

            if (currentData.image) {
                imgEl.src = currentData.image; imgEl.style.display = 'block';
            } else {
                imgEl.src = ""; imgEl.style.display = 'none';
            }

            wrapper.className = 'content-wrapper slide-in';
            await new Promise(r => setTimeout(r, 300));
            if (currentSequenceId !== mySequenceId) return;

            const qTyped = await typeWriter(currentData.question, questionEl, QUESTION_TYPING_SPEED, mySequenceId);
            if (!qTyped) return;
            await new Promise(r => setTimeout(r, 500)); 
            if (currentSequenceId !== mySequenceId) return;

            for (let i = 0; i < currentData.choices.length; i++) {
                const choiceDiv = document.createElement('div');
                choiceDiv.className = 'choice'; choiceDiv.id = 'choice-' + i;
                choiceDiv.style.fontSize = currentData.choiceFontSize || DEFAULT_CHOICES_FONT_SIZE;
                choicesContainer.appendChild(choiceDiv);
                
                const cTyped = await typeWriter(currentData.choices[i], choiceDiv, CHOICES_TYPING_SPEED, mySequenceId);
                if (!cTyped) return;
                await new Promise(r => setTimeout(r, 200)); 
                if (currentSequenceId !== mySequenceId) return;
            }

            await new Promise(r => setTimeout(r, COUNTDOWN_START_DELAY));
            if (currentSequenceId !== mySequenceId) return; 

            timerWrapper.style.display = 'flex';
            for (let i = 5; i > 0; i--) {
                timerEl.innerText = i;
                if (audioCtx) {
                    const osc = audioCtx.createOscillator();
                    osc.frequency.value = 600; osc.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                }
                timerEl.style.transform = "scale(1.3)";
                setTimeout(() => timerEl.style.transform = "scale(1)", 200);
                await new Promise(r => setTimeout(r, 1000));
                if (currentSequenceId !== mySequenceId) return;
            }
            
            timerEl.innerText = "TIME'S UP!";
            timerEl.style.fontSize = "3.5rem"; timerEl.style.color = "#fbbf24";
            playTimesUpSound();

            const correctEl = document.getElementById('choice-' + currentData.correctAnswerIndex);
            if(correctEl) correctEl.classList.add('correct');

            await new Promise(r => setTimeout(r, 2000));
            if (currentSequenceId === mySequenceId) timerWrapper.style.display = 'none';
        }

        document.addEventListener('keydown', (e) => {
            initAudio();
            if (e.key === 'ArrowRight') {
                if (currentQIndex < quizData.length - 1) {
                    currentQIndex++; loadQuestion(currentQIndex, 'next');
                } else {
                    document.getElementById('topic-badge').style.display = 'none';
                    document.getElementById('question').innerHTML = "Quiz Complete! Follow for more.";
                    document.getElementById('question').style.textAlign = "center";
                    document.getElementById('question').style.fontSize = "2rem";
                    document.getElementById('choices').innerHTML = '';
                    document.getElementById('timer-wrapper').style.display = 'none';
                    document.getElementById('question-image').style.display = 'none';
                }
            } else if (e.key === 'ArrowLeft') {
                if (currentQIndex > 0) {
                    currentQIndex--; loadQuestion(currentQIndex, 'prev');
                }
            }
        });
    <\/script>
</body>
</html>`;
            
            document.getElementById('output-code').value = template;
            return template;
        }

        function copyCode() {
            const code = document.getElementById('output-code');
            if(!code.value) generateCode();
            
            code.select();
            document.execCommand('copy');
            alert("HTML Code copied to clipboard!");
        }

        function downloadCode() {
            let code = document.getElementById('output-code').value;
            if(!code) code = generateCode();

            const blob = new Blob([code], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Custom_ICT_Reel.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
